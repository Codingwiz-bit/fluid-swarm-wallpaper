<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Swarm V2 (Turbulence)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020202;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            user-select: none;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 9999; /* Ensure it is always on top */
            pointer-events: auto;
        }
        #ui:hover {
            color: rgba(255, 255, 255, 1);
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        #hint {
            position: absolute;
            bottom: 80px;
            right: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hint">Or Right-Click anywhere to cycle</div>
    <div id="ui">Mode: Vortex</div>
    <script src="script.js"></script>
</body>
</html>
